# Security headers for tug202.com. Included at server scope AND inside every
# location that calls add_header (see tug202.com.conf for why).
#
# CSP notes:
#   - Fonts are self-hosted via @fontsource, so no fonts.googleapis.com.
#   - 'unsafe-inline' for styles is required by React inline style props.
#   - img-src allows https: so an embedded Facebook/Youtube thumbnail or a
#     future donate-widget image does not break; tighten later if unused.
#   - frame-src is left at 'self' until a donate provider is chosen; add its
#     origin here when embedding (e.g. https://www.paypal.com).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
