# Security headers for tug202.org. Included at server scope AND inside every
# location that calls add_header (see tug202.org.conf for why).
#
# CSP notes:
#   - Fonts are self-hosted via @fontsource, so no fonts.googleapis.com.
#   - 'unsafe-inline' for styles is required by React inline style props.
#   - img-src allows https: so an embedded Facebook/Youtube thumbnail or a
#     future donate-widget image does not break; tighten later if unused.
#   - Givebutter: library from widgets.givebutter.com; checkout iframes and
#     API calls go to *.givebutter.com. Stripe (their processor) runs inside
#     the Givebutter iframe, so it needs no allowance here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://widgets.givebutter.com; style-src 'self' 'unsafe-inline' https://widgets.givebutter.com; img-src 'self' https: data:; font-src 'self' https://widgets.givebutter.com data:; connect-src 'self' https://*.givebutter.com; frame-src 'self' https://*.givebutter.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://*.givebutter.com" always;
