# nginx site config for tug202.com
#
# Install:
#   sudo cp nginx/tug202.com.conf /etc/nginx/sites-available/tug202.com
#   sudo cp nginx/security-headers.conf /etc/nginx/snippets/tug202-security-headers.conf
#   sudo ln -s /etc/nginx/sites-available/tug202.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get the certificate (certbot rewrites this file to add the 443 block):
#   sudo certbot --nginx -d tug202.com -d www.tug202.com
#
# The `include` of the security-headers snippet is repeated inside every
# location that uses add_header, because nginx drops inherited add_header
# directives the moment a child block declares its own.

server {
    listen 80;
    listen [::]:80;
    server_name tug202.com www.tug202.com;

    root /var/www/tug202;
    index index.html;

    include snippets/tug202-security-headers.conf;

    # Hashed Vite assets are immutable.
    location /assets/ {
        include snippets/tug202-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photos change rarely; a day is plenty.
    location /images/ {
        include snippets/tug202-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Express backend (PM2 "tug202-backend") on :3202.
    location /api/ {
        proxy_pass http://127.0.0.1:3202;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # React Router: every other path serves the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
